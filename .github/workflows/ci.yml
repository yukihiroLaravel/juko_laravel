name: PHP CI

on:
  pull_request:
    branches:
      - develop
      - 'topic/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
        tools: composer:v2.8.8

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --ansi

    # Pint・規約・ER 図・PHPStan・Rector・テストを順に流す。中身は composer.json の check-all にあり、
    # Claude Code の Stop フック（scripts/hooks/stop-check.sh）も同じものを流す
    - name: Run all checks
      run: composer check-all
